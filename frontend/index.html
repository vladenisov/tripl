<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="oklch(0.14 0.01 250)" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="oklch(0.99 0.002 250)" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Tripl — analytics tracking-plan, monitoring, and alerting workspace." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="mask-icon" href="/favicon.svg" color="#1FB2BD" />

    <!-- Preconnect to font origins before the stylesheet request goes out so the
         TLS handshake overlaps with HTML parse, shaving a round-trip off LCP. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- Resolve the theme before React boots so the first paint matches the
         saved or system preference instead of flashing the opposite background.
         Kept external so the production CSP can retain script-src 'self'. -->
    <script src="/theme-init.js"></script>

    <title>tripl</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
