# Git pre-commit hooks.
#
# Install once per clone:  make install-hooks
#
# These call the project's OWN ruff through uv, rather than the separately-pinned
# copy that astral-sh/ruff-pre-commit would fetch. That is deliberate: ruff's
# formatter output can change between releases, so a second, independently-pinned
# ruff is a standing source of "the hook formatted it, then CI rejected it". One
# ruff — the one in backend/uv.lock — runs in the hook, in `make lint-be`, and in
# CI.
#
# ruff-format rewrites files in place and pre-commit then FAILS the commit, so you
# review the result and `git add` it. Formatting is applied for you; nothing is
# committed behind your back.
#
# `--extra dev` is not optional: ruff lives in the dev extra, and a bare
# `uv run` syncs the environment to the default dependencies only — which would
# uninstall ruff out from under the hook that is trying to call it.
#
# Only backend Python is covered: the frontend has no formatter configured
# (eslint lints but does not format), so there is nothing to enforce there yet.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (backend)
        # --force-exclude: pre-commit passes explicit filenames, and without it
        # ruff ignores the `extend-exclude` in backend/pyproject.toml and would
        # happily reformat alembic/versions.
        entry: uv run --project backend --extra dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/

      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --project backend --extra dev ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/
