name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Allow the release workflow to run CI as a gate before publishing an image.
  workflow_call:

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          # uv reads backend/.python-version itself during `uv sync`; setup-uv
          # has no `python-version-file` input (it warned "Unexpected input").

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src/

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Reads the pnpm version from frontend/package.json "packageManager".
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
