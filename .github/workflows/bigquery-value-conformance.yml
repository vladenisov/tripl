name: BigQuery value conformance

on:
  # Never expose cloud credentials to pull-request code. The emulator analysis
  # gate in ci.yml remains the required BigQuery check on every PR; real values
  # execute only after trusted code reaches main.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bigquery-value-conformance
  cancel-in-progress: false

jobs:
  credentials:
    name: Validate credential configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    env:
      BQ_VALUE_CONFORMANCE_ENABLED: ${{ vars.BQ_VALUE_CONFORMANCE_ENABLED }}
      BQ_SERVICE_ACCOUNT_JSON: ${{ secrets.BQ_SERVICE_ACCOUNT_JSON }}
      BQ_PROJECT: ${{ vars.BQ_PROJECT }}
    steps:
      - id: probe
        name: Detect configured BigQuery identity
        shell: bash
        run: |
          if [ "$BQ_VALUE_CONFORMANCE_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BigQuery value conformance is intentionally disabled."
          elif [ -n "$BQ_SERVICE_ACCOUNT_JSON" ] && [ -n "$BQ_PROJECT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "BigQuery value conformance is enabled."
          else
            echo "::error::BQ_VALUE_CONFORMANCE_ENABLED=true requires BQ_SERVICE_ACCOUNT_JSON and BQ_PROJECT."
            exit 1
          fi

  values:
    name: Real BigQuery values
    needs: credentials
    if: needs.credentials.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Execute real BigQuery value contract
        env:
          # Step-scoped: the credential never reaches checkout, dependency setup,
          # caches, artifacts, or a file on disk.
          TRIPL_CONF_BQ_CREDENTIALS_JSON: ${{ secrets.BQ_SERVICE_ACCOUNT_JSON }}
          TRIPL_CONF_BQ_REAL_PROJECT: ${{ vars.BQ_PROJECT }}
          TRIPL_CONF_BQ_REAL_LOCATION: ${{ vars.BQ_LOCATION }}
          TRIPL_BQ_VALUE_REQUIRED: "1"
        run: |
          uv run pytest -q \
            --junitxml=bigquery-value-conformance.xml \
            src/tripl/tests/conformance/test_bigquery_value_conformance.py

      - name: Prove the credentialed gate ran without skips
        if: always()
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse("bigquery-value-conformance.xml").getroot()
          except (OSError, ET.ParseError) as exc:
              sys.exit(f"::error::no BigQuery value JUnit report: {exc}. The gate did not run.")
          tests = errors = failures = skipped = 0
          for suite in root.iter("testsuite"):
              tests += int(suite.get("tests", 0))
              errors += int(suite.get("errors", 0))
              failures += int(suite.get("failures", 0))
              skipped += int(suite.get("skipped", 0))
          print(f"BigQuery values: {tests} collected, {failures} failed, {errors} errored, {skipped} skipped")
          if tests == 0:
              sys.exit("::error::0 BigQuery value tests ran.")
          if skipped:
              sys.exit(f"::error::{skipped} BigQuery value test(s) skipped.")
          if failures or errors:
              sys.exit(f"::error::{failures} failed / {errors} errored BigQuery value test(s).")
          PY
