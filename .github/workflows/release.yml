name: Release

# Triggered by pushing a vX.Y.Z tag (see bin/release.sh). Runs the full CI
# suite first, then builds the multi-arch single-container image and pushes it
# to GHCR tagged X.Y.Z / X.Y / latest, and cuts a GitHub Release.
on:
  push:
    tags:
      - "v*"
  # Manual re-run for an existing tag (e.g. if a push-build failed transiently).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.4.0"
        required: true

jobs:
  # Gate: reuse the PR/main CI so we never publish an image from red code.
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On workflow_dispatch we check out the requested tag; on tag push the
          # default ref is already the tag.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # On tag push the version comes from the ref; on workflow_dispatch we
          # pass the input so X.Y.Z / X.Y / latest still resolve correctly.
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag }}
            type=sha,format=short
          # flavor latest=auto (default) tags :latest for stable (non-prerelease)
          # semver releases only.

      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
