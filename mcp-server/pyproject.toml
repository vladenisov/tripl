[project]
name = "tripl-mcp"
version = "0.1.0"
description = "Standalone MCP server exposing a curated agent toolset over the tripl REST API"
readme = "README.md"
requires-python = ">=3.12"
# Apache-2.0 while the SERVICE is AGPL-3.0-or-later, and that split is
# deliberate: this package is a standalone httpx client of the REST API — it
# imports nothing from `tripl` — so a permissive licence lets anyone embed it in
# their own agent without the service's copyleft reaching into their codebase.
# Apache rather than MIT for the express patent grant.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vladislav Denisov" }]
keywords = ["mcp", "model-context-protocol", "analytics", "tracking-plan", "tripl"]
# Trove classifiers are what PyPI's sidebar and search filters read. No
# "Private :: Do Not Upload" here on purpose — this package IS meant to be
# installed by users (uvx tripl-mcp), unlike the service itself, which ships as
# a container image.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    # Upper bound is load-bearing, not caution: this package imports
    # ``mcp.server.fastmcp``, which mcp 2.0 removed when it reorganised the
    # server API (2.0 ships mcp.server.mcpserver instead). uv.lock pins 1.28.1
    # so the repo and CI never see it, but a lockfile is not published — an
    # installer resolving ">=1.9.0" alone gets 2.0 and the console script dies
    # on import with ModuleNotFoundError. Caught by installing the built wheel
    # into a clean venv before the first PyPI upload.
    "mcp>=1.9.0,<2",
    # Upper bound for the same reason `mcp<2` carries one: a published wheel
    # ships constraints, not the lockfile, so an unbounded floor lets a
    # consumer resolve a future major that moved the API out from under us.
    "httpx>=0.27.0,<1",
    # The HTTP client lives in the `tripl` distribution and is IMPORTED from
    # there, not copied (tripl-ey6j.1). Copying 179 lines would have been the
    # fourth instance of this repo's recurring drift defect — query keys drifted
    # four ways, the event-name regex three, plus security headers and the
    # signal significance gate.
    #
    # `tripl` 0.1.0 is on PyPI since tripl-ey6j.6, so this constraint resolves
    # from an index like any other dependency. [tool.uv.sources] below still
    # points development and CI at the sibling checkout, so an edit in ../cli
    # needs no install step; uv strips that table from PUBLISHED metadata, so
    # the wheel carries this plain constraint alone (verified against the built
    # artifact, not assumed) and a consumer resolves it from the index.
    "tripl>=0.1,<0.2",
]

[project.urls]
Homepage = "https://vladenisov.github.io/tripl/"
Documentation = "https://vladenisov.github.io/tripl/integrate/mcp-server"
Repository = "https://github.com/vladenisov/tripl"
Issues = "https://github.com/vladenisov/tripl/issues"

[project.scripts]
tripl-mcp = "tripl_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    "respx>=0.22",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.uv.sources]
# Development and CI only: resolve `tripl` from the sibling checkout rather than
# from the published release, so an edit in ../cli is picked up with no install
# step and both suites exercise the same source. uv strips this table from
# published metadata, so the wheel keeps the plain ">=0.1,<0.2" constraint
# declared above and consumers resolve `tripl` from PyPI. `../cli` is
# also the only thing named `tripl` in the repo now — backend/ used to declare
# that distribution name too and is `tripl-server` since tripl-ey6j.6.
tripl = { path = "../cli" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripl_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
